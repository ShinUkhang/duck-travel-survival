<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🦆 오리 서바이벌 월드투어</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#1b2a4a 0%,#0d1526 55%,#070c16 100%);
    color:#fff;min-height:100%;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x:hidden;
  }
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;width:100%;max-width:1100px;padding:28px 18px 40px;display:flex;flex-direction:column;align-items:center}
  .logo{font-size:64px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
  h1{font-size:clamp(26px,5vw,44px);font-weight:900;margin:10px 0 4px;letter-spacing:-1px;
     background:linear-gradient(180deg,#ffe88f,#ffb13d);-webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 4px 24px rgba(255,177,61,.25)}
  .sub{color:#9fb3d9;font-size:clamp(13px,2.4vw,17px);margin-bottom:26px}
  .cards{display:flex;gap:18px;width:100%;justify-content:center;flex-wrap:wrap}
  .card{
    flex:1 1 280px;max-width:330px;background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:26px 22px 24px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    cursor:pointer;text-decoration:none;color:#fff;
  }
  .card:hover,.card:active{transform:translateY(-6px) scale(1.02);border-color:rgba(255,217,61,.55);
    box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px rgba(255,217,61,.25)}
  .card .emoji{font-size:58px;margin-bottom:10px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
  .card h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .card .tag{display:inline-block;font-size:12px;font-weight:700;color:#0d1526;background:#ffd93d;
    border-radius:20px;padding:3px 12px;margin-bottom:12px}
  .card.fukuoka .tag{background:#ff8ab3}
  .card.daegu .tag{background:#7fd4ff}
  .card.daejeon .tag{background:#b8e62e}
  .card p{font-size:13.5px;line-height:1.65;color:#c4d2ec;min-height:66px}
  .card ul{list-style:none;margin:12px 0 18px;font-size:12.5px;color:#8fa3c8;line-height:1.9}
  .playbtn{
    display:block;text-align:center;margin-top:auto;width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
    font-size:17px;font-weight:900;color:#0d1526;
    background:linear-gradient(180deg,#ffe88f,#ffb13d);box-shadow:0 6px 0 #b87a1a,0 10px 22px rgba(0,0,0,.35);
    transition:transform .1s;
  }
  .playbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b87a1a}
  .tip{margin-top:30px;max-width:640px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:16px 20px;font-size:13px;line-height:1.8;color:#9fb3d9}
  .tip b{color:#ffe88f}
  footer{margin-top:18px;color:#5a6c8f;font-size:12px}
  @media (orientation:landscape) and (max-height:500px){
    .logo{font-size:40px}h1{font-size:26px}.sub{margin-bottom:14px}
    .card{padding:16px}.card .emoji{font-size:40px}.card p{min-height:0}
  }
.card.jinju{background:linear-gradient(135deg,#3a2a1a,#1a1a2e)}
.card.jinju .emoji{font-size:64px}
.card.chuncheon{background:linear-gradient(135deg,#2a4a2a,#1a2a1a)}
.card.chuncheon .emoji{font-size:64px}
.card.jamsil{background:linear-gradient(135deg,#3a1a4a,#1a1a2e)}
.card.jamsil .emoji{font-size:64px}

  .railmap{width:100%;max-width:850px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
    border-radius:22px;padding:24px 18px;margin-bottom:10px}
  .line-title{font-size:20px;font-weight:800;margin-bottom:12px;color:#ffe88f}
  .map-svg{width:100%;height:auto;display:block}
  .station{cursor:pointer}
  .station circle{transition:all .15s}
  .station:hover circle{stroke-width:8;filter:drop-shadow(0 0 10px rgba(255,217,61,.6))}
  .plane-card{display:flex;align-items:center;gap:16px;background:linear-gradient(165deg,rgba(255,138,179,.15),rgba(255,138,179,.05));
    border:1px solid rgba(255,138,179,.3);border-radius:18px;padding:18px 22px;text-decoration:none;color:#fff;
    transition:transform .15s}
  .plane-card:hover{transform:translateY(-3px)}
  .plane-card .emoji{font-size:48px}
  .plane-card h2{font-size:20px;margin-bottom:4px}
  .plane-card p{font-size:13px;color:#c4d2ec}
  .plane-card .playbtn{margin-left:auto;width:auto;padding:12px 28px}
</style>
</head>
<body>
<canvas class="stars" id="stars"></canvas>
<div class="wrap">
  <div class="logo">🦆</div>
  <h1>오리 서바이벌 월드투어</h1>
  <div class="sub">여행지를 선택하고 좀비 오리들로부터 살아남아라!</div>
  <div class="railmap">
    <div class="line-title">🚂 국내 여행은 기차로!</div>
    <svg viewBox="0 0 800 420" class="map-svg">
      <!-- 경부선 (파랑) -->
      <line x1="100" y1="120" x2="700" y2="120" stroke="#3a8ad8" stroke-width="10" stroke-linecap="round"/>
      <text x="100" y="95" fill="#3a8ad8" font-size="18" font-weight="800">🚄 경부선</text>
      <!-- 경춘선 (청록) -->
      <line x1="100" y1="120" x2="100" y2="320" stroke="#2ac8a8" stroke-width="10" stroke-linecap="round"/>
      <line x1="100" y1="320" x2="500" y2="320" stroke="#2ac8a8" stroke-width="10" stroke-linecap="round"/>
      <text x="110" y="310" fill="#2ac8a8" font-size="18" font-weight="800">🚃 경춘선</text>
      <!-- 진주선 (주황, 경전선) -->
      <line x1="400" y1="120" x2="400" y2="280" stroke="#f0a020" stroke-width="10" stroke-linecap="round"/>
      <line x1="400" y1="280" x2="650" y2="280" stroke="#f0a020" stroke-width="10" stroke-linecap="round"/>
      <text x="410" y="270" fill="#f0a020" font-size="18" font-weight="800">🚂 경전선</text>

      <!-- 서울 (출발) -->
      <a href="duck.html"><g class="station">
        <circle cx="100" cy="120" r="22" fill="#fff" stroke="#ffd93d" stroke-width="5"/>
        <text x="100" y="128" text-anchor="middle" font-size="20">🦆</text>
        <text x="100" y="165" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">서울 · 기본오리</text>
      </g></a>
      <!-- 대전 (경부선) -->
      <a href="daejeon.html"><g class="station">
        <circle cx="300" cy="120" r="22" fill="#fff" stroke="#3a8ad8" stroke-width="5"/>
        <text x="300" y="128" text-anchor="middle" font-size="20">🚂</text>
        <text x="300" y="165" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">대전</text>
      </g></a>
      <!-- 대구 (경부선) -->
      <a href="daegu.html"><g class="station">
        <circle cx="550" cy="120" r="22" fill="#fff" stroke="#3a8ad8" stroke-width="5"/>
        <text x="550" y="128" text-anchor="middle" font-size="20">🏙️</text>
        <text x="550" y="165" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">대구</text>
      </g></a>
      <!-- 잠실 (경부선 종점 근처) -->
      <a href="jamsil.html"><g class="station">
        <circle cx="700" cy="120" r="22" fill="#fff" stroke="#3a8ad8" stroke-width="5"/>
        <text x="700" y="128" text-anchor="middle" font-size="20">🗼</text>
        <text x="700" y="165" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">잠실</text>
      </g></a>
      <!-- 춘천 (경춘선) -->
      <a href="chuncheon.html"><g class="station">
        <circle cx="500" cy="320" r="22" fill="#fff" stroke="#2ac8a8" stroke-width="5"/>
        <text x="500" y="328" text-anchor="middle" font-size="20">🍗</text>
        <text x="500" y="365" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">춘천</text>
      </g></a>
      <!-- 진주 (경전선) -->
      <a href="jinju.html"><g class="station">
        <circle cx="650" cy="280" r="22" fill="#fff" stroke="#f0a020" stroke-width="5"/>
        <text x="650" y="288" text-anchor="middle" font-size="20">🏮</text>
        <text x="650" y="325" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">진주</text>
      </g></a>
    </svg>
    <div class="line-title" style="margin-top:10px">✈️ 해외 여행은 비행기로!</div>
    <a class="plane-card" href="fukuoka.html">
      <div class="emoji">🗾</div>
      <div><h2>후쿠오카</h2><p>비행기 타고 일본으로! ✈️</p></div>
      <span class="playbtn">▶ 탑승</span>
    </a>
  </div>
  <div class="tip">
    📱 <b>폰에서 가로 전체화면으로 즐기기:</b><br>
    ① 게임 화면 우상단 <b>⛶</b> 버튼을 눌러보세요 (안드로이드/아이패드는 바로 전체화면!)<br>
    ② 아이폰이라면 <b>공유 → 홈 화면에 추가</b> 후 홈 화면 아이콘으로 실행하면<br>
    &nbsp;&nbsp;&nbsp;앱처럼 가로 전체화면으로 플레이할 수 있어요! 🔄📲
  </div>
  <footer>🦆 Duck Travel Survival · made with Muse</footer>
</div>
<script>
// 반짝이는 별 배경
const c=document.getElementById('stars'),x=c.getContext('2d');
function size(){c.width=innerWidth;c.height=innerHeight}
size();addEventListener('resize',size);
const st=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,p:Math.random()*6.28}));
(function loop(t){
  x.clearRect(0,0,c.width,c.height);
  for(const s of st){
    x.globalAlpha=.25+.55*Math.abs(Math.sin(t/1400+s.p));
    x.fillStyle='#fff';x.beginPath();x.arc(s.x*c.width,s.y*c.height,s.r,0,6.29);x.fill();
  }
  x.globalAlpha=1;requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
